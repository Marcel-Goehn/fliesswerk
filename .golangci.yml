# golangci-lint v2. Blocking run: every finding here fails CI.
version: "2"

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      # High-severity gosec findings fail the job. Lower ones are reported
      # warn-only by the second run in CI (.golangci.warn.yml).
      severity: high
      confidence: low

formatters:
  enable:
    - gofmt
