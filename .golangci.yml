# golangci-lint v2. Blocking run: every finding here fails CI.
version: "2"

# Also lint the scripted fake Harness, which only builds with this test-only
# tag (internal/harness/fakeclaude).
run:
  build-tags:
    - kwkfake

linters:
  default: standard
  enable:
    - gosec
  settings:
    gosec:
      # High-severity gosec findings fail the job. Lower ones are reported
      # warn-only by the second run in CI (.golangci.warn.yml).
      severity: high
      confidence: low

formatters:
  enable:
    - gofmt
